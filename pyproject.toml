[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "adk-document-assistant"
version = "0.1.0"
description = "Governed Google ADK document research assistant"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.135.1",
  "google-adk==2.9.2",
  "google-genai==2.19.0",
  "litellm==1.85.7",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "pypdf==6.7.4",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
document-assistant-ingest = "app.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
